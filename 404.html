<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>
body{
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f5f5f5;
margin:0;
text-align:center;
}

.box{
padding:40px;
background:white;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

a{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:8px;
}
</style>

</head>

<body>

<div class="box">

<h1>404</h1>

<h2>Page Not Found</h2>

<p>The page you're looking for doesn't exist.</p>

<a href="/">Go to Home</a>

</div>

</body>
</html>
